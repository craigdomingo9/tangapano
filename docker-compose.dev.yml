name: Tangapano Development Environment

services:
  backend:
    container_name: backend_dev
    restart: always
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_ENV=development
      - DB_HOST=db_dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db_dev
    networks:
      - app_net

  frontend:
    container_name: frontend_dev
    restart: always
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - node_modules_volume:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/
    depends_on:
      - backend
    networks:
      - app_net

  db_dev:
    image: postgres:15
    container_name: db_dev
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - app_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_dev
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db_dev
    networks:
      - app_net

  nginx:
    container_name: nginx_dev
    restart: always
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

volumes:
  postgres_data:
  static_volume:
  media_volume:
  node_modules_volume:

networks:
  app_net:
    driver: bridge
