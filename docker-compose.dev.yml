name: Tangapano

services:
  backend:
    container_name: backend
    restart: always
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_ENV=development
      - ELASTICSEARCH_HOST=elasticsearch
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - pgbouncer
      - redis
    networks:
      - app_net
      - debug_toolbar_network

  # frontend:
