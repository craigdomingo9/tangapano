name: Tangapano

services:
  backend:
    build:
      context: ./backend
      target: production
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ENV=production
      - PROMETHEUS_METRICS_EXPORT_PORT=8000
      - ELASTICSEARCH_HOST=elasticsearch
      - REBUILD_SEARCH_INDEX=on
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - pgbouncer
    restart: always
    networks:
      - app_net
    labels:
      "com.tangapano.service": "backend"

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/
      - NEXT_PUBLIC_CLIENT_URL=http://localhost/api/
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    restart: always
    networks:
      - app_net
    labels:
      "com.tangapano.service": "frontend"

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app_net
    labels:
      "com.tangapano.service": "db"

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.0-p0
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    env_file:
      - .env
    ports:
      - "6432:6432"
    depends_on:
      - db
    networks:
      - app_net
    restart: unless-stopped
    labels:
      "com.tangapano.service": "pgbouncer"

  redis:
    image: redis:8.2.1
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app_net
    labels:
      "com.tangapano.service": "redis"

  # --- Elasticsearch Service ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.ml.enabled=false     
      - xpack.graph.enabled=false  
      - xpack.watcher.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    labels:
      "com.tangapano.service": "elasticsearch"
    devices:
      - /dev/urandom:/dev/random
    networks:
      - app_net

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app_net
    labels:
      "com.tangapano.service": "redis-commander"

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always
    networks:
      - app_net
    labels:
      "com.tangapano.service": "pgadmin"

  backup:
    build: ./backup
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PACK_ALL_INTO_ONE_ZIP=false
    volumes:
      - media_volume:/app/media
    restart: unless-stopped
    networks:
      - app_net
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles: ["backup"]
    labels:
      "com.tangapano.service": "backup"

  db-restore:
    build: ./restore
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app_net
    command: ["/app/docker-db-restore.sh"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles: ["restore"]
    labels:
      "com.tangapano.service": "db-restore"

  images-restore:
    build: ./restore
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    networks:
      - app_net
    command: ["/app/docker-images-restore.sh"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles: ["restore"]
    labels:
      "com.tangapano.service": "images-restore"

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf # dev
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: always
    command: 'nginx -g "daemon off;"' # Just run Nginx
    networks:
      - app_net
    labels:
      "com.tangapano.service": "nginx"

  cert-renewer:
    build:
      context: ./cert-renewer
    volumes:
      # Share the same volumes
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      # Mount the Docker socket to control Nginx
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # --- THIS MAKES IT REUSABLE ---
      - DOMAIN=tangapano.co.zw
      - EMAIL=craigdomingo9@gmail.com
      - STAGING=0 # Use 0 for production, 1 for testing/development
      - NGINX_LABEL=com.tangapano.service=nginx
      - RENEWAL_INTERVAL_HOURS=12
    restart: always
    networks:
      - app_net
    depends_on:
      - nginx # Wait for Nginx (with its dummy certs) to be running
    labels:
      "com.tangapano.service": "cert-renewer"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9000:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_net
    profiles: ["metrics"]
    labels:
      "com.tangapano.service": "prometheus"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "9001:3000"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app_net
    profiles: ["metrics"]
    labels:
      "com.tangapano.service": "grafana"

  # --- MONITOR SERVICE ---
  health-monitor:
    build: ./health-monitor
    restart: always
    volumes:
      # 1. This is the "Docker-out-of-Docker" (DooD) magic:
      #    It maps the host's Docker socket into the container,
      #    giving the Python 'docker' library control over
      #    its sibling containers.
      - /var/run/docker.sock:/var/run/docker.sock

      # 2. Mount the config file so you can change it without rebuilding
      - ./health-monitor/services.yaml:/app/services.yaml:ro

      # 3. Mount the log folder for persistence
      - .health-monitor/logs:/app/logs

    networks:
      - app_net
    labels:
      "com.tangapano.service": "health-monitor"

volumes:
  postgres_data:
  es_data:
  prometheus_data:
  grafana_data:
  static_volume:
  media_volume:
  redis_data:

networks:
  app_net:
    driver: bridge
