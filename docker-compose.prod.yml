name: Tangapano Production Environment

services:
  backend:
    container_name: backend
    build:
      context: ./backend
      target: production
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./backups/images:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ENV=production
      - DB_HOST=db
      - PROMETHEUS_METRICS_EXPORT_PORT=8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          memory: 4G
          cpus: '3.0'
    depends_on:
      - db
    restart: always
    networks:
      - app_net

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/
      - NODE_ENV=production
    depends_on:
      - backend
    restart: always
    networks:
      - app_net

  db:
    image: postgres:15
    container_name: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    deploy:
      resources:
        limits:
        reservations:
          memory: 4G
          cpus: '3.0'
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app_net

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "5050:80"
    deploy:
      resources:
        limits:
        reservations:
          memory: 1G
          cpus: '1'
    depends_on:
      - db
    restart: always
    networks:
      - app_net

  backup:
    container_name: postgres_backup
    image: postgres:15
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_backups:/backups
      - ./backups/db:/backups
    command: |
      sh -c "
      # Wait for the database to be ready.
      until pg_isready -h db -U postgres; do
        echo 'Waiting for database to be ready...'
        sleep 2
      done

      echo 'Database is ready. Starting backup service.'

      # Change directory to the backups volume.
      cd /backups

      # Define a local variable to ensure the sleep interval is available.
      sleep_interval=\"$${DB_BACKUP_SLEEP_INTERVAL}\" &&

      # Start the backup loop.
      while true; do
        TIMESTAMP=$$(date +\\%F_\\%H-%M-%S)
        backup_name=backup_$$TIMESTAMP.sql
        pg_dump -h db -U postgres -d $${POSTGRES_DB} > $$backup_name
        ls -1t *.sql | tail -n +$${DB_BACKUP_KEEP_ONLY_LAST} | xargs -r rm --
        echo 'Backup created. Name: ' $$backup_name
        sleep $$sleep_interval;
      done"
    restart: unless-stopped
    networks:
      - app_net

  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
      - postgres_backups:/app/backups
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        reservations:
          memory: 1G
          cpus: '2'
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app_net

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9000:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        reservations:
          memory: 1G
          cpus: '2'
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_net

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "9001:3000"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    deploy:
      resources:
        reservations:
          memory: 1G
          cpus: '2'
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app_net

volumes:
  postgres_data:
  postgres_backups:
  prometheus_data:
  grafana_data:
  static_volume:
  media_volume:

networks:
  app_net:
    driver: bridge
