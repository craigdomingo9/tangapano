name: Tangapano Production Environment

services:
  backend:
    container_name: backend
    restart: always
    build:
      context: ./backend
      target: production
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ENV=production
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - app_net

  frontend:
    container_name: frontend
    restart: always
    build:
      context: ./frontend
      target: production
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - app_net

  db:
    image: postgres:15
    container_name: db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - app_net

  pgadmin:
    container_name: pgadmin
    restart: always
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_net

  backup:
    container_name: postgres_backup
    image: postgres:15
    depends_on:
      - db
    environment:
      PGPASSWORD: postgres
    volumes:
      - postgres_backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /backups
        while true; do
          TIMESTAMP=$(date +\%F_\%H-%M-%S)
          pg_dump -h db -U postgres mydb > /backups/backup_$TIMESTAMP.sql
          # Keep only the last 7 backups
          ls -1t /backups | tail -n +8 | xargs -r rm --
          sleep 24h
        done
    restart: unless-stopped

  nginx:
    container_name: nginx
    restart: always
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

volumes:
  postgres_data:
  postgres_backup:
  static_volume:
  media_volume:

networks:
  app_net:
    driver: bridge
