name: Tangapano Production Environment

services:
  backend:
    container_name: backend
    build:
      context: ./backend
      target: production
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ENV=production
      - PROMETHEUS_METRICS_EXPORT_PORT=8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - pgbouncer
    restart: always
    networks:
      - app_net

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    restart: always
    networks:
      - app_net

  db:
    image: postgres:17
    container_name: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app_net

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.0-p0
    container_name: pgbouncer
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    env_file:
      - .env
    ports:
      - "6432:6432"
    depends_on:
      - db
    networks:
      - app_net
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:8.2.1
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app_net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app_net

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always
    networks:
      - app_net

  backup:
    build: ./backup
    container_name: backup
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PACK_ALL_INTO_ONE_ZIP=false
    volumes:
      - media_volume:/app/media
    restart: unless-stopped
    networks:
      - app_net
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles: ["backup"]

  db-restore:
    build: ./restore
    container_name: db_restore
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app_net
    command: ["/app/docker-db-restore.sh"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles: ["restore"]

  images-restore:
    build: ./restore
    container_name: images_restore
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    networks:
      - app_net
    command: ["/app/docker-images-restore.sh"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles: ["restore"]

  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app_net
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - nginx
    command: "renew --webroot -w /var/www/certbot --quiet"
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9000:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_net
    profiles: ["metrics"]

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "9001:3000"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app_net
    profiles: ["metrics"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  static_volume:
  media_volume:
  redis_data:

networks:
  app_net:
    driver: bridge
