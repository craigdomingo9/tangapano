name: Tangapano Production Environment

services:
  backend:
    container_name: backend
    build:
      context: ./backend
      target: production
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./backups/images:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ENV=production
      - DB_HOST=db
      - PROMETHEUS_METRICS_EXPORT_PORT=8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always
    networks:
      - app_net

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/
      - NEXT_PUBLIC_CLIENT_API_URL=${NEXT_PUBLIC_CLIENT_API_URL}
      - NEXT_PUBLIC_DOMAIN=${DOMAIN}
      - NODE_ENV=production
    depends_on:
      - backend
    restart: always
    networks:
      - app_net

  db:
    image: postgres:17
    container_name: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app_net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    env_file:
      - .env
    ports:
      - "6432:6432"
    depends_on:
      - db
    networks:
      - app_net
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:latest
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app_net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app_net

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always
    networks:
      - app_net

  backup:
    container_name: postgres_backup
    image: postgres:17
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_backups:/backups
      - ./backups/db:/backups
    command: |
      sh -c "
      # Wait for the database to be ready.
      until pg_isready -h db -U postgres; do
        echo 'Waiting for database to be ready...'
        sleep 2
      done

      echo 'Database is ready. Starting backup service.'

      # Change directory to the backups volume.
      cd /backups

      # Define a local variable to ensure the sleep interval is available.
      sleep_interval=\"$${DB_BACKUP_SLEEP_INTERVAL}\" &&

      # Start the backup loop.
      while true; do
        TIMESTAMP=$$(date +\\%F_\\%H-%M-%S)
        backup_name=backup_$$TIMESTAMP.sql
        pg_dump -h db -U postgres -d $${POSTGRES_DB} > $$backup_name
        ls -1t *.sql | tail -n +$${DB_BACKUP_KEEP_ONLY_LAST} | xargs -r rm --
        echo 'Backup created. Name: ' $$backup_name
        sleep $$sleep_interval;
      done"
    restart: unless-stopped
    networks:
      - app_net

  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
      - postgres_backups:/app/backups
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app_net

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9000:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_net

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "9001:3000"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app_net

volumes:
  postgres_data:
  postgres_backups:
  prometheus_data:
  grafana_data:
  static_volume:
  media_volume:
  redis_data:

networks:
  app_net:
    driver: bridge
