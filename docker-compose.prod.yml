name: Tangapano

# -----------------------------------------------------------------
# ♻️ REUSABLE LOGGING CONFIGURATION
# -----------------------------------------------------------------
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -----------------------------------------------------------------
  # BACKEND (The Bridge)
  # -----------------------------------------------------------------
  # Connects to BOTH networks.
  backend:
    build:
      context: ./backend
      target: production
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ENV=production
      - PROMETHEUS_METRICS_EXPORT_PORT=8000
      - ELASTICSEARCH_HOST=elasticsearch
      - REBUILD_SEARCH_INDEX=on
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - pgbouncer
    restart: always
    labels:
      "com.tangapano.service": "backend"
    networks:
      - internet_net
      - data_net
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    #read_only: true
    user: root
    tmpfs:
      - /tmp:rw,noexec,nosuid # Writable temp, but cannot execute scripts in it
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2500M

  # -----------------------------------------------------------------
  # FRONTEND
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend_v2
      dockerfile: ./Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=https://tangapano.co.zw/api
      - INTERNAL_API_URL=http://backend:8000/api
      - NEXT_PUBLIC_DOMAIN=https://tangapano.co.zw
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - backend
    restart: always
    labels:
      "com.tangapano.service": "frontend"
    networks:
      - internet_net
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1500M

  # -----------------------------------------------------------------
  # DATA LAYER (Secure Vault - No Internet)
  # -----------------------------------------------------------------
  # All these services act as if they are in an air-gapped room.

  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    labels:
      "com.tangapano.service": "db"
    networks:
      - data_net # 🔒 Internal Only
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid
      - /tmp:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 4096M

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.0-p0
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    labels:
      "com.tangapano.service": "pgbouncer"
    networks:
      - data_net # 🔒 Internal Only
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    depends_on:
      - db
    labels:
      "com.tangapano.service": "redis"
    networks:
      - data_net
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    tmpfs:
      - /tmp:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - JAVA_OPTS=-Djava.security.egd=file:/dev/urandom
    volumes:
      - es_data:/usr/share/elasticsearch/data
    labels:
      "com.tangapano.service": "elasticsearch"
    networks:
      - data_net # 🔒 Internal Only
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /usr/share/elasticsearch/config/jvm.options.d # Sometimes needs write
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 6G

  # -----------------------------------------------------------------
  # ADMIN TOOLS (Internal Network + SSH Tunnel)
  # -----------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - data_net # 🔒 Internal Only
    user: root
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:8
    env_file:
      - .env
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    restart: always
    labels:
      "com.tangapano.service": "pgadmin"
    networks:
      - data_net
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    user: root
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # -----------------------------------------------------------------
  # UTILITIES
  # -----------------------------------------------------------------
  # Backup connects to both because it needs to read DB (data_net)
  # and potentially upload to S3/Cloud (internet_net).
  backup:
    build: ./backup_v2
    container_name: backup
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - MEGA_DB_FOLDER=TangaPanoPostgresDailyBackups
      - MEGA_IMAGES_FOLDER=TangaPanoImagesWeeklyBackups
      - ENV=production
      - NUCLEAR_INIT=false
    volumes:
      - media_volume:/app/media
    restart: unless-stopped
    labels:
      "com.tangapano.service": "backup"
    networks:
      - data_net
      - internet_net
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    user: root
    read_only: false
    tmpfs:
      - /tmp
      - /app/logs:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  restore:
    build: ./restore_v2
    container_name: restore
    volumes:
      - media_volume:/app/data/images
      - restore_staging:/tmp/restore_staging
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MEGA_EMAIL=${MEGA_EMAIL}
      - MEGA_PASSWORD=${MEGA_PASSWORD}
      - STAGING_DIR=/tmp/restore_staging
      - RESTORE_DESTINATION=${IMAGE_SOURCE_DIR:-/app/media}
      - RESTORE_TYPE=${RESTORE_TYPE:-IMAGES}  # IMAGES or SQL
      - RESTORE_MODE=${RESTORE_MODE:-LATEST} # LATEST or TIMESTAMP
      - REMOTE_FOLDER=TangaPanoImagesWeeklyBackups # TangaPanoImagesWeeklyBackups | TangaPanoPostgresDailyBackups
    depends_on:
      - db
    profiles: ["restore"]
    labels:
      "com.tangapano.service": "restore"
    networks:
      - data_net
      - internet_net
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    read_only: false
    user: root
    tmpfs:
      - /tmp:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    restart: "no"


  cert-renewer:
    build:
      context: ./cert-renewer
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOMAIN=tangapano.co.zw
      - EMAIL=craigdomingo9@gmail.com
      - STAGING=0
      - NGINX_LABEL=com.tangapano.service=nginx
      - RENEWAL_INTERVAL_HOURS=12
    restart: always
    depends_on:
      - nginx
    labels:
      "com.tangapano.service": "cert-renewer"
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    #security_opt:
    #  - no-new-privileges:true
    #user: root
    read_only: false
    user: root
    tmpfs:
      - /tmp:rw,noexec,nosuid
    networks:
      - internet_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  # -----------------------------------------------------------------
  # PUBLIC FACING
  # -----------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: always
    command: 'nginx -g "daemon off;"'
    labels:
      "com.tangapano.service": "nginx"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - internet_net
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    read_only: false
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid
      - /var/run:rw,noexec,nosuid
      - /tmp:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

  # -----------------------------------------------------------------
  # MONITORING
  # -----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["metrics"]
    labels:
      "com.tangapano.service": "prometheus"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2048M
    networks:
      - internet_net # Needs to scrape Backend
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    read_only: false
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:9001:3000"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["metrics"]
    labels:
      "com.tangapano.service": "grafana"
    # 🔒 TITANIUM SECURITY
    logging: *default-logging
    read_only: false
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internet_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  health-monitor:
    build: ./health-monitor
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./health-monitor/services.yaml:/app/services.yaml:ro
      - .health-monitor/logs:/app/logs
    labels:
      "com.tangapano.service": "health-monitor"
    logging: *default-logging
    networks:
      - internet_net
      - data_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

volumes:
  postgres_data:
  es_data:
  prometheus_data:
  grafana_data:
  static_volume:
  media_volume:
  redis_data:
  pgadmin_data:

# -----------------------------------------------------------------
# NETWORK DEFINITIONS
# -----------------------------------------------------------------
networks:
  # 🌍 Network WITH Internet Access
  internet_net:
    driver: bridge

  # 🔒 Network WITHOUT Internet Access (The Vault)
  data_net:
    driver: bridge
    internal: true
