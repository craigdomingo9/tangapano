events {
    worker_connections 1024;
}

http {
    # --- BASIC SETTINGS ---
    include       mime.types;
    default_type  application/octet-stream;
    
    # Hide Nginx version number (Security)
    server_tokens off; 

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Compression (Speed)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_proxied any;


    # 1. DEFINE THE BAD BOTS (The "Wanted" List)
    # This maps the User-Agent header to a variable $bad_bot
    map $http_user_agent $bad_bot {
        default 0;
        "~*netcrawler" 1;
        "~*wget" 1;
        "~*curl" 1;
        "~*libwww" 1;
        "~*python" 1;
        "~*nikto" 1;
        "~*sqlmap" 1;
        "~*java" 1;
        "~*go-http-client" 1;
    }

    # --- RATE LIMITING ZONES ---
    # Define this AT THE TOP of http block
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # --- UPSTREAMS ---
    # We only list services that Nginx explicitly proxies to.
    # PgAdmin and Redis are removed because we access them via SSH Tunnel now.
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # --- HTTP TO HTTPS REDIRECT ---
    server {
        listen 80;
        server_name tangapano.co.zw www.tangapano.co.zw;

        # Certbot Challenges (Keep this for SSL renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Force HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # --- MAIN HTTPS SERVER ---
    server {
        listen 443 ssl;
        http2 on;
        server_name tangapano.co.zw www.tangapano.co.zw;
        
        # Max upload size (for images/media)
        client_max_body_size 20M;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/tangapano.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tangapano.co.zw/privkey.pem;
        
        # SSL Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # --- SECURITY HEADERS ---
        # These protect your users from common browser attacks
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # BLOCK BOTS IMMEDIATELY
        if ($bad_bot) {
            return 403; # Forbidden
        }

        # --- FRONTEND (Next.js) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js Image Optimization
        location /_next/image {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- BACKEND API (Django) ---
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 🛡️ Rate Limit: 10 req/sec with a burst buffer of 50
            limit_req zone=api_limit burst=50 nodelay;
        }

        # --- STATIC FILES ---
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --- MEDIA FILES ---
        location /media/ {
            alias /app/media/;
            expires 1d;
            add_header Cache-Control "public";
            allow all; # Ensure media files are accessible to everyone
        }
    }
}