events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend_v2:3000;
    }

    upstream backend {
        server backend:8000;
    }

    upstream redis-commander {
        server redis-commander:8081;
    }

    upstream pgadmin {
        server pgadmin:80;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name tangapano.co.zw www.tangapano.co.zw;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name tangapano.co.zw www.tangapano.co.zw;
        client_max_body_size 20M;

        ssl_certificate /etc/letsencrypt/live/tangapano.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tangapano.co.zw/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js image optimization endpoint
        location /_next/image {
            proxy_pass http://frontend;  # Your Next.js frontend service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Rate Limiting
            limit_req zone=api_limit burst=50;
        }

        # Static files
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Media files.
        location /media/ {
            alias /app/media/;
            expires 1d;
            add_header Cache-Control "public";
            allow all;

        }

        # Redis Commander GUI
        location /redis-gui/ {
            proxy_pass http://redis-commander/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # WebSocket support
            proxy_buffering off;
            proxy_redirect off;
            
            # Increase timeouts
            proxy_read_timeout 86400;
            proxy_connect_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /pgadmin/ {
            proxy_pass http://pgadmin/;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_redirect off;
        }

        # Alternative: If you want Redis Commander at the root path /redis-gui (without trailing slash)
        location /redis-gui {
            return 302 /redis-gui/;
        }

        location /pgadmin {
            return 302 /pgadmin/;
        }
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN"; # Prevents clickjacking
    add_header X-Content-Type-Options "nosniff"; # Prevents MIME type sniffing
    add_header X-XSS-Protection "1; mode=block"; # Enables XSS filter in browsers
    add_header Referrer-Policy "strict-origin-when-cross-origin"; # Controls referrer information sent with requests
    

    # Compression reduces the size of HTTP responses, saving bandwidth and speeding up delivery.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript; # Specifies the file types to compress.
    gzip_min_length 1024; # Compress files larger than 1024 bytes.
    gzip_proxied any; # Ensures that responses from upstream servers are also compressed.

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Including MIME types configuration file for proper content type detection
    include mime.types;

    # Enabling sendfile for efficient file transmission
    sendfile on;

    # Optimizing sendfile packets for better performance
    tcp_nopush on;
}
