events {
    worker_connections 1024;
}

http {
    # upstream frontend {
    #     server frontend_v2:3000;
    # }
    upstream backend {
        server backend:8000;
    }
    upstream redis-commander {
        server redis-commander:8081;
    }
    # upstream pgadmin {
    #     server pgadmin:80;
    # }

    server {
        listen 80;
        client_max_body_size 20M;

        # location / {
        #     proxy_pass http://frontend;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # # Next.js image optimization endpoint
        # location /_next/image {
        #     proxy_pass http://frontend;  # Your Next.js frontend service
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Media files.
        location /media/ {
            alias /app/media/;
            expires 1d;
            add_header Cache-Control "public";
            allow all;
        }

        # Redis Commander GUI
        location /redis-gui/ {
            proxy_pass http://redis-commander/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_redirect off;
        }

        # location /pgadmin/ {
        #     proxy_pass http://pgadmin/;
        #     proxy_set_header X-Script-Name /pgadmin;
        #     proxy_redirect off;
        # }

        location /redis-gui {
            return 302 /redis-gui/;
        }

        # location /pgadmin {
        #     return 302 /pgadmin/;
        # }
    }
}
