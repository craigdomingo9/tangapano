; PgBouncer configuration file - MODERATE SETTINGS
; ===============================================

; === DATABASE CONNECTION SECTION ===
[databases]
; Define database connections
; Format: alias = connection_string
; * = wildcard that matches any database name requested by client
* = host=db port=5432 dbname=tangapano user=postgres password=root

; === PGBOUNCER CORE SETTINGS ===
[pgbouncer]
; Network listening configuration
listen_addr = *
listen_port = 6432

; Authentication settings
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# CONNECTION POOLING (Adjusted for moderate PostgreSQL config)
pool_mode = transaction
# Reduced from 1000 to match PostgreSQL max_connections
max_client_conn = 200                   
# Reduced from 25 (matches PostgreSQL capacity)
default_pool_size = 15                  
# Reduced from 5
min_pool_size = 3                       
# Reduced from 10
reserve_pool_size = 5                   
# Increased from 5 (more conservative)
reserve_pool_timeout = 10               
# Matches PostgreSQL max_connections
max_db_connections = 60                 
# Reduced from 50
max_user_connections = 30               

# CONNECTION MANAGEMENT (More conservative)
# Reduced from 15
server_connect_timeout = 10             
# Reduced from 5
server_login_retry = 3                  
# Reduced from 3600 (30 minutes instead of 1 hour)
server_lifetime = 1800                  
# Reduced from 600 (5 minutes instead of 10)
server_idle_timeout = 300               
server_reset_query = DISCARD ALL
server_reset_query_always = 0

# CLIENT CONNECTION SETTINGS (More aggressive timeouts)
# Set to 5 minutes (was 0 - infinite)
client_idle_timeout = 300               
# Reduced from 60
client_login_timeout = 30               
# Set to 5 minutes (was 0 - infinite)
idle_transaction_timeout = 300          
# Keep unlimited for complex queries
query_timeout = 0                       
# Reduced from 120
query_wait_timeout = 60                 
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 60
tcp_keepintvl = 10

# ADMINISTRATIVE SETTINGS
admin_users = postgres
stats_users = monitoring, stats
ignore_startup_parameters = extra_float_digits

# LOGGING AND MONITORING (Reduced logging for performance)
# Reduced from 1 (only log errors)
log_connections = 0                     
# Reduced from 1 (only log errors)
log_disconnections = 0                  
log_pooler_errors = 1
log_stats = 1
# Increased from 60 (5 minutes instead of 1)
stats_period = 300                      
verbose = 0
syslog = 0

# SECURITY
server_tls_sslmode = prefer
client_tls_sslmode = disable

# PERFORMANCE TUNING (Conservative settings)
# Reduced from 4096
pkt_buf = 2048                          
# Reduced from 1000
sbuf_loopcnt = 500                      
# Reduced from 10
suspend_timeout = 5                     

# DNS SETTINGS
# Increased from 15
dns_max_ttl = 30                        
dns_zone_check_period = 0
# Increased from 15
dns_nxdomain_ttl = 30                   
ignore_startup_parameters = extra_float_digits

# ADDITIONAL MODERATE SETTINGS
# Disable prepared statements in pool
max_prepared_statements = 0             
# Don't add host to application_name
application_name_add_host = 0           