; PgBouncer configuration file

; === DATABASE CONNECTION SECTION ===
[databases]
; Define database connections
; Format: alias = connection_string
; * = wildcard that matches any database name requested by client
* = host=db port=5432 dbname=tangapano user=postgres password=root

; === PGBOUNCER CORE SETTINGS ===
[pgbouncer]
; Network listening configuration
listen_addr = *
listen_port = 6432

; Authentication settings
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Connection pooling mode
pool_mode = transaction
; Options: session, transaction, statement
; transaction = pool connection per transaction (recommended for web apps)

; Connection pool limits
max_client_conn = 50
default_pool_size = 10
reserve_pool_size = 5
max_db_connections = 25

; Timeout settings
server_idle_timeout = 600

; Logging configuration
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Admin interface
admin_users = postgres
stats_period = 60

; DNS settings
ignore_startup_parameters = extra_float_digits