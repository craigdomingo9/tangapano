; PgBouncer configuration file

; === DATABASE CONNECTION SECTION ===
[databases]
; Define database connections
; Format: alias = connection_string
; * = wildcard that matches any database name requested by client
* = host=db port=5432 dbname=tangapano user=postgres password=root

; === PGBOUNCER CORE SETTINGS ===
[pgbouncer]
; Network listening configuration
listen_addr = *
listen_port = 6432

; Authentication settings
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt


# CONNECTION POOLING
pool_mode = transaction                # Most compatible mode
max_client_conn = 1000                 # Maximum client connections
default_pool_size = 25                 # Connections per database/user combo
min_pool_size = 5                      # Minimum kept ready
reserve_pool_size = 10                 # Emergency pool when main is exhausted
reserve_pool_timeout = 5               # Seconds before using reserve pool
max_db_connections = 100               # Should match postgresql max_connections
max_user_connections = 50              # Per user limit


# CONNECTION MANAGEMENT
server_connect_timeout = 15            # Connection timeout to PostgreSQL
server_login_retry = 5                 # Retry interval for failed logins
server_lifetime = 3600                 # Close server connection after 1 hour
server_idle_timeout = 600              # Close idle server connection after 10 min
server_reset_query = DISCARD ALL       # Reset connection before reuse
server_reset_query_always = 0          # Only reset for transaction pooling

# CLIENT CONNECTION SETTINGS
client_idle_timeout = 0                # Don't timeout clients (application should manage)
client_login_timeout = 60              # Client authentication timeout
idle_transaction_timeout = 0           # Don't timeout idle transactions
query_timeout = 0                      # No query timeout (application should manage)
query_wait_timeout = 120               # Wait time if all connections are busy
tcp_keepalive = 1                      # Enable TCP keepalive
tcp_keepcnt = 3                        # Number of keepalive probes
tcp_keepidle = 60                      # Seconds before starting keepalives
tcp_keepintvl = 10                     # Interval between keepalives

# ADMINISTRATIVE SETTINGS
admin_users = postgres                 # Users with admin privileges
stats_users = monitoring, stats        # Users allowed to view stats
ignore_startup_parameters = extra_float_digits  # Parameters to ignore

# LOGGING AND MONITORING
log_connections = 1                    # Log successful connections
log_disconnections = 1                 # Log disconnections
log_pooler_errors = 1                  # Log pool errors
log_stats = 1                          # Enable statistics logging
stats_period = 60                      # Statistics collection interval (seconds)
verbose = 0                            # Reduced verbosity for production
syslog = 0                             # Disable syslog if using direct logging

# SECURITY
server_tls_sslmode = prefer            # TLS mode for backend connections
client_tls_sslmode = disable           # Disable TLS for clients (enable if needed)

# PERFORMANCE TUNING
pkt_buf = 4096                         # Network packet buffer size
sbuf_loopcnt = 1000                    # Max number of packets to process per loop
suspend_timeout = 10                   # Seconds to wait before suspending a client

# DNS SETTINGS
dns_max_ttl = 15                       # Maximum DNS TTL
dns_zone_check_period = 0              # Disable DNS zone checking
dns_nxdomain_ttl = 15                  # TTL for failed DNS lookups
ignore_startup_parameters = extra_float_digits