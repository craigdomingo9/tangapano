; PgBouncer configuration file

; === DATABASE CONNECTION SECTION ===
[databases]
; Define database connections
; Format: alias = connection_string
; * = wildcard that matches any database name requested by client
* = host=db port=5432 dbname=tangapano user=postgres password=root

; === PGBOUNCER CORE SETTINGS ===
[pgbouncer]
; Network listening configuration
listen_addr = *
listen_port = 6432

; Authentication settings
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt


# CONNECTION POOLING
pool_mode = transaction                
max_client_conn = 1000                 
default_pool_size = 25
min_pool_size = 5                      
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 100
max_user_connections = 50


# CONNECTION MANAGEMENT
server_connect_timeout = 15
server_login_retry = 5
server_lifetime = 3600
server_idle_timeout = 600
server_reset_query = DISCARD ALL
server_reset_query_always = 0

# CLIENT CONNECTION SETTINGS
client_idle_timeout = 0
client_login_timeout = 60              
idle_transaction_timeout = 0            
query_timeout = 0
query_wait_timeout = 120
tcp_keepalive = 1                      
tcp_keepcnt = 3
tcp_keepidle = 60
tcp_keepintvl = 10                     

# ADMINISTRATIVE SETTINGS
admin_users = postgres
stats_users = monitoring, stats
ignore_startup_parameters = extra_float_digits

# LOGGING AND MONITORING
log_connections = 1                    
log_disconnections = 1                 
log_pooler_errors = 1                  
log_stats = 1                          
stats_period = 60
verbose = 0
syslog = 0

# SECURITY
server_tls_sslmode = prefer
client_tls_sslmode = disable

# PERFORMANCE TUNING
pkt_buf = 4096
sbuf_loopcnt = 1000
suspend_timeout = 10

# DNS SETTINGS
dns_max_ttl = 15                       
dns_zone_check_period = 0
dns_nxdomain_ttl = 15
ignore_startup_parameters = extra_float_digits