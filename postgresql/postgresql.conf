# MODERATE POSTGRESQL CONFIG (7GB RAM, 6 cores)
# =============================================

# MEMORY SETTINGS
# ~15% of RAM (more conservative)
shared_buffers = 1GB                      
# Reduced to prevent memory bloat
work_mem = 8MB                           
# More reasonable for maintenance
maintenance_work_mem = 512MB             
# More realistic cache estimate
effective_cache_size = 5GB               
# Reduced temp space
temp_buffers = 16MB                      

# WAL SETTINGS (Balanced WAL management)
# More conservative WAL buffers
wal_buffers = 16MB                       
# Less frequent WAL flushes
wal_writer_delay = 200ms                 
# Larger batches for efficiency
wal_writer_flush_after = 1MB             
# Smaller WAL segments
min_wal_size = 1GB                       
# Less WAL retention
max_wal_size = 4GB                       
# Less aggressive checkpoint spreading
checkpoint_completion_target = 0.7       
# Less frequent checkpoints
checkpoint_timeout = 15min               

# QUERY PARALLELISM (Conservative core utilization)
# Use fewer cores
max_parallel_workers = 4                 
# Less aggressive parallelism
max_parallel_workers_per_gather = 2      
# Conservative maintenance parallelism
max_parallel_maintenance_workers = 2     
parallel_leader_participation = on

# CONNECTIONS
# Further reduced for stability
max_connections = 60                     
superuser_reserved_connections = 3

# VACUUM AND AUTOVACUUM (Less aggressive maintenance)
# Less frequent vacuum triggers
autovacuum_vacuum_scale_factor = 0.1     
# Less frequent stats updates
autovacuum_analyze_scale_factor = 0.05   
# More delay to reduce I/O impact
autovacuum_vacuum_cost_delay = 10ms      
# Lower cost limit for smoother operation
autovacuum_vacuum_cost_limit = 1000      
# Check less frequently
autovacuum_naptime = 60s                 
# Fewer concurrent vacuum workers
autovacuum_max_workers = 2               

# QUERY PLANNING (Conservative for mixed workload)
# More conservative for SSD
effective_io_concurrency = 100           
# More realistic random vs sequential cost
random_page_cost = 1.5                   
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# BACKGROUND WRITER (Less aggressive flushing)
# Check less frequently
bgwriter_delay = 200ms                   
# Write fewer pages at once
bgwriter_lru_maxpages = 100              
# Less aggressive buffer allocation
bgwriter_lru_multiplier = 2.0            
# Moderate flush size
bgwriter_flush_after = 512kB             

# LOGGING
# Only log slow queries (>1s)
log_min_duration_statement = 1000        
log_statement = 'none'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '
log_checkpoints = on
log_connections = on
log_disconnections = on

# STATISTICS
track_activities = on
track_counts = on
# Turn off I/O timing to reduce overhead
track_io_timing = off                    
# Reduce function tracking overhead
track_functions = none                   

# TIMEouts
idle_in_transaction_session_timeout = 10min  # More generous timeout
# Slightly longer lock timeout
lock_timeout = 30s                       

# ADDITIONAL STABILITY SETTINGS
# Standard statistics quality
default_statistics_target = 100          
# Better partition handling
constraint_exclusion = partition         