# AGGRESSIVE POSTGRESQL CONFIG (7GB RAM, 6 cores)
# ================================================

# MEMORY SETTINGS
shared_buffers = 2GB                     
# ~30% of dedicated RAM
# Increased for better sorts/hashes
work_mem = 16MB                         
# Larger vacuum/index operations
maintenance_work_mem = 1GB              
# Account for OS cache
effective_cache_size = 10GB             
# Increased for complex queries
temp_buffers = 32MB                     

# WAL SETTINGS (More aggressive WAL management)
# Increased for better write throughput
wal_buffers = 32MB                      
# More frequent WAL flushes
wal_writer_delay = 5ms                  
# Smaller batches for smoother I/O
wal_writer_flush_after = 512kB          
# Larger WAL segments
min_wal_size = 2GB                      
# More WAL retention for checkpoints
max_wal_size = 8GB                      
# Smear checkpoints over longer period
checkpoint_completion_target = 0.95     
# More frequent checkpoints
checkpoint_timeout = 10min              

# QUERY PARALLELISM (Better utilize 6 cores)
# Use all cores
max_parallel_workers = 6                
# More aggressive parallelism
max_parallel_workers_per_gather = 4     
# Faster index builds/vacuums
max_parallel_maintenance_workers = 4    
parallel_leader_participation = on

# CONNECTIONS
# Reduced for more memory per connection
max_connections = 80                    
superuser_reserved_connections = 3

# VACUUM AND AUTOVACUUM (More aggressive maintenance)
# Trigger vacuum sooner
autovacuum_vacuum_scale_factor = 0.05   
# Update stats more frequently
autovacuum_analyze_scale_factor = 0.02  
# Less delay during vacuum
autovacuum_vacuum_cost_delay = 2ms      
# Higher cost limit for faster vacuum
autovacuum_vacuum_cost_limit = 3000     
# Check for work more frequently
autovacuum_naptime = 30s                
# More vacuum workers
autovacuum_max_workers = 4              

# QUERY PLANNING (Optimized for SSD/mixed workload)
# Higher for SSD/NVMe
effective_io_concurrency = 200          
# Keep slightly above seq_page_cost
random_page_cost = 1.1                  
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# BACKGROUND WRITER (More aggressive flushing)
# Check more frequently
bgwriter_delay = 100ms                  
# Write more pages at once
bgwriter_lru_maxpages = 200             
# More aggressive buffer allocation
bgwriter_lru_multiplier = 4.0           
# Smaller flushes for smoother I/O
bgwriter_flush_after = 256kB            

# LOGGING
# Log slower queries (reduced from 1000ms)
log_min_duration_statement = 500        
log_statement = 'none'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '
log_checkpoints = on
log_connections = on
log_disconnections = on

# STATISTICS
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# TIMEouts
# Reduced to free resources faster
idle_in_transaction_session_timeout = 5min  
# Faster lock resolution
lock_timeout = 20s                         