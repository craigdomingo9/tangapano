# BALANCED POSTGRESQL CONFIG FOR 16GB RAM, 6 CORES
# ================================================

# MEMORY SETTINGS (Total: ~10GB allocated)
shared_buffers = 4GB                    # 25% of total RAM
work_mem = 32MB                         # Much safer - will use ~3.2GB with 100 connections
maintenance_work_mem = 1GB              # Good for 16GB RAM
effective_cache_size = 12GB             # Estimate of OS cache available
temp_buffers = 32MB                     # Reduced from 64MB

# WAL SETTINGS
wal_buffers = 16MB                      # Adequate for most workloads
wal_writer_delay = 10ms                 # Good setting
wal_writer_flush_after = 1MB            # Good setting
min_wal_size = 1GB                      # More reasonable
max_wal_size = 4GB                      # Reduced from 8GB
checkpoint_completion_target = 0.9      # Slightly more conservative
checkpoint_timeout = 15min              # More frequent checkpoints

# QUERY PARALLELISM
max_parallel_workers = 6                # Match your core count
max_parallel_workers_per_gather = 4     # More conservative
max_parallel_maintenance_workers = 2    # Reduced from 4
parallel_leader_participation = on      # Better for most workloads

# CONNECTIONS
max_connections = 100                   # Reasonable
superuser_reserved_connections = 3      # Reduced from 10

# VACUUM AND AUTOVACUUM
autovacuum_vacuum_scale_factor = 0.1    # Less aggressive vacuum
autovacuum_analyze_scale_factor = 0.05  # Less aggressive analyze
autovacuum_vacuum_cost_delay = 10ms     # More conservative
autovacuum_vacuum_cost_limit = 2000     # Good setting
autovacuum_naptime = 60s                # Less frequent autovacuum runs

# QUERY PLANNING
effective_io_concurrency = 200          # Still high but more reasonable
random_page_cost = 1.1                  # Slightly higher for more realistic planning
seq_page_cost = 1.0                     # Good for SSDs
cpu_tuple_cost = 0.01                   # OK
cpu_index_tuple_cost = 0.005            # OK
cpu_operator_cost = 0.0025              # OK

# BACKGROUND WRITER
bgwriter_delay = 200ms                  # Less frequent writes
bgwriter_lru_maxpages = 100             # Much more conservative
bgwriter_lru_multiplier = 2.0           # More conservative multiplier
bgwriter_flush_after = 0                # Let OS handle flushing

# LOGGING (unchanged - these are good settings)
log_min_duration_statement = 1000
log_statement = 'none'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '
log_checkpoints = on
log_connections = on
log_disconnections = on

# STATISTICS (unchanged - good for monitoring)
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all