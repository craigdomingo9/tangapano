# Directory where Redis will store persistent data (dump.rdb, appendonly.aof, etc.)
dir /data

# Enable append-only file persistence mode
appendonly yes

# Name of the append-only file
appendfilename "appendonly.aof"

# Fsync policy for append-only file: everysec = fsync every second
appendfsync everysec

# Rewrite AOF when it is 100% larger than the original size
auto-aof-rewrite-percentage 100

# Minimum size of AOF file to trigger a rewrite
auto-aof-rewrite-min-size 64mb

# Save the DB if at least 1 key changed in 900 seconds
save 900 1

# Save the DB if at least 10 keys changed in 300 seconds
save 300 10

# Save the DB if at least 10000 keys changed in 60 seconds
save 60 1000
